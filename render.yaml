databases:
  - name: bharat-securex-db
    databaseName: bharat_securex
    user: bharat_securex
    plan: free

services:
  - type: web
    name: bharat-securex-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bharat-securex-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://bharat-securex-frontend.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: bharat-securex-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: API_KEY
        fromService:
          type: web
          name: bharat-securex-api
          envVarKey: API_KEY
      - key: BACKEND_URL
        value: https://bharat-securex-api.onrender.com
